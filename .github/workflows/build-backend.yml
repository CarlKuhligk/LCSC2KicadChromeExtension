name: Build backend binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # Windows only: install.py registers the Native Host through the Windows
    # registry. A macOS/Linux binary would write a manifest nothing reads, so we
    # ship no artifact rather than a broken one. Cross-OS support is issue #13.
    name: Build host binary (Windows)
    runs-on: windows-latest
    env:
      APP_NAME: "KiCadPartsImporterHost"
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # `pip install .` is load-bearing, not tidiness: PyInstaller analyses
      # host.py with sys.path = [native_host/], from which easyeda2kicad is not
      # importable. host.py's sys.path bootstrap only runs at runtime, and is
      # skipped when frozen. Without installing the package first, not one
      # engine module lands in the bundle.
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow

      - name: Prepare PyInstaller icon
        shell: pwsh
        run: python packaging/pyinstaller/build_windows_ico.py

      # --console (the default) is load-bearing: --windowed sets sys.stdout to
      # None on Windows, which silently destroys the Native Messaging frames.
      # --collect-submodules pulls in modules PyInstaller's static analysis of
      # host.py might otherwise miss.
      # --add-data ships packageTaxonomy.json, which package_form.py reads at
      # import time via a path relative to its package. Without it the host dies
      # on startup with FileNotFoundError.
      - name: Build PyInstaller binary
        shell: pwsh
        run: |
          pyinstaller --onefile --console `
            --icon "build\pyinstaller\app.ico" `
            --name "$env:APP_NAME" `
            --collect-submodules native_host `
            --collect-submodules easyeda2kicad `
            --add-data "chrome_extension/shared/packageTaxonomy.json;chrome_extension/shared" `
            native_host/host.py

      # Proves the two things a broken bundle would silently get wrong: that the
      # frozen host can reach install.py and register itself, and that it still
      # serves (rather than reinstalling) when Chrome starts it with an origin.
      - name: Smoke-test the binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "binary not produced at $exe" }

          & $exe --register
          if ($LASTEXITCODE -ne 0) { throw "--register exited with $LASTEXITCODE" }

          $manifest = Join-Path $env:LOCALAPPDATA "KiCadPartsImporter\com.kicad_parts_importer.host.json"
          if (-not (Test-Path $manifest)) { throw "no manifest written to $manifest" }
          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($m.path -ne (Resolve-Path $exe).Path) { throw "manifest points at $($m.path), not the binary" }
          if ($m.allowed_origins[0] -notmatch '^chrome-extension://[a-p]{32}/$') { throw "bad origin: $($m.allowed_origins[0])" }

          # Chrome hands over an origin. Closed stdin means EOF on the first
          # frame, so the host must exit 0 instead of crashing or registering.
          $null | & $exe $m.allowed_origins[0]
          if ($LASTEXITCODE -ne 0) { throw "host exited with $LASTEXITCODE on closed stdin" }

          Write-Host "Binary registers, and serves when Chrome launches it."

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist\$env:APP_NAME.exe" "out\$env:VERSION-$env:APP_NAME.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.VERSION }}-KiCadPartsImporterHost-Windows"
          path: out/*

  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    env:
      EXT_DIR: chrome_extension
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify extension manifest
        run: |
          test -f "$EXT_DIR/manifest.json" || { echo "Missing manifest.json"; exit 1; }
          # A stripped `key` means Chrome derives the ID from the install path and
          # the Native Host, registered for one fixed origin, is never reachable.
          python -c "import json,sys; m=json.load(open('$EXT_DIR/manifest.json')); sys.exit(0 if m.get('key') else 'manifest.json is missing the pinned key')"

      - name: Create extension zip
        run: |
          zip -r "${VERSION}-KiCad Parts Importer-Chrome.zip" "$EXT_DIR" \
            -x "$EXT_DIR/node_modules/*" \
               "$EXT_DIR/package.json" \
               "$EXT_DIR/package-lock.json" \
               "$EXT_DIR/vitest.config.mjs" \
               "*.test.js" \
               "*.test.mjs" \
               "*.map"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.VERSION }}-KiCad Parts Importer-Chrome"
          path: "${{ env.VERSION }}-KiCad Parts Importer-Chrome.zip"

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, package-extension]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body: |
            Windows only. macOS and Linux are not supported yet (issue #13).

            **Install**
            1. Download and unzip the Chrome extension archive.
            2. Open `chrome://extensions`, enable Developer mode, choose
               *Load unpacked*, and select the `chrome_extension` folder.
            3. Run `KiCadPartsImporterHost.exe` once. It registers itself and exits.
            4. Reload the extension, then open any LCSC product page.

            Windows may warn about an unsigned binary; choose *More info* →
            *Run anyway*.
